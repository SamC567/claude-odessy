[project]
name = "odysseus"
version = "0.1.0"
description = "Jarvis / Odysseus private, local-first assistant foundation (Milestone A)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3.0",
    "PyYAML>=6.0,<7.0",
    "requests>=2.28,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
jarvis = "odysseus.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["odysseus*"]
